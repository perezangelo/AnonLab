<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Recupero Credenziali — AnonLab</title>

<link rel="stylesheet" href="/css/style.css">

<style>
  body {
    background:#000814;
    color:#00eaff;
    font-family:"Courier New", monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.recover-box {
    text-align:center;
    padding:40px;
    border:1px solid #00eaff55;
    background:#00111f;
    box-shadow:0 0 22px #00eaff55;
    max-width:460px;
    border-radius:10px;
}

.recover-box h2 {
    margin-bottom:15px;
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
}

.recover-box p {
    color:#c8f7ff;
    font-size:15px;
    margin-bottom:20px;
    line-height:1.6;
}

.recover-box input {
    width:90%;
    padding:12px;
    margin-bottom:15px;
    background:#000814;
    border:1px solid #00eaff55;
    color:#c8f7ff;
    border-radius:4px;
    font-size:15px;
}

.recover-box input:focus {
    outline:none;
    border-color:#00eaff;
    box-shadow:0 0 10px #00eaff55;
}

.recover-box button {
    padding:12px 28px;
    background:#00eaff;
    color:#00111f;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:0.2s;
}

.recover-box button:hover {
    background:#5ef2ff;
    box-shadow:0 0 12px #00eaff;
}

#msg {
    display:none;
    margin-top:20px;
    color:#c8f7ff;
    font-size:14px;
}
</style>

  <link rel="preload" as="script" href="https://cdn.iubenda.com/cs/iubenda_cs.js"/>

<script>
(_iub=self._iub||[]).csConfiguration={
	cookiePolicyId: 12413505,
	siteId: 4661380,
	localConsentDomain: 'anonlab.it',
	timeoutLoadConfiguration: 30000,
	lang: 'it',
	enableTcf: true,
	tcfVersion: 2,
	tcfPurposes: {
		 "2": "consent_only",
		 "3": "consent_only",
		 "4": "consent_only",
		 "5": "consent_only",
		 "6": "consent_only",
		 "7": "consent_only",
		 "8": "consent_only",
		 "9": "consent_only",
		"10": "consent_only"
	},
	invalidateConsentWithoutLog: true,
	googleAdditionalConsentMode: true,
	consentOnContinuedBrowsing: false,
	banner: {
		position: "bottom",
		acceptButtonDisplay: true,
		customizeButtonDisplay: true,
		closeButtonDisplay: true,
		closeButtonRejects: true,
		fontSizeBody: "14px",
	},

</head>

<body>

<div class="recover-box">
  <h2>Recupero Credenziali</h2>

<p>
Inserisci il tuo <strong>username</strong> o la tua
<strong>email</strong> per recuperare l'accesso
al tuo account AnonLab.
</p>

  <form action="https://angelonline.altervista.org/backend/recover.php"
        method="POST"
        onsubmit="mostraMessaggio()">

      <input type="text"
             name="input"
             placeholder="Username o Email"
             required
             autocomplete="username"
             inputmode="text"
             aria-label="Inserisci username o email">

      <button type="submit">Recupera</button>
  </form>

  <p id="msg">Operazione completata. Verrai reindirizzato tra pochi secondi alla home...</p>
</div>

<script>
function mostraMessaggio() {
  document.getElementById("msg").style.display = "block";
  setTimeout(() => {
    window.location.href = "/";
  }, 3000);
}
</script>
