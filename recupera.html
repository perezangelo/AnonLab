<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Recupero Credenziali — AnonLab</title>
<meta name="description" content="Recupera in modo sicuro l'accesso al tuo account sulla piattaforma AnonLab.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background:#000814;
    color:#00eaff;
    font-family:"Courier New", monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    padding:20px;
    box-sizing:border-box;
}

.recover-box {
    text-align:center;
    padding:35px 30px;
    border:1px solid #00eaff55;
    background:#00111f;
    box-shadow:0 0 22px #00eaff55;
    max-width:460px;
    width:100%;
    border-radius:10px;
}

.recover-box h1 {
    margin-bottom:15px;
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
    font-size: 1.5rem;
}

.recover-box p {
    color:#c8f7ff;
    font-size:14px;
    margin-bottom:20px;
    line-height:1.6;
}

/* Scelta opzioni */
.mode-selector {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.mode-btn {
    flex:1;
    background:#001a2d;
    border:1px solid #00eaff55;
    color:#c8f7ff;
    padding:8px 5px;
    font-size:12px;
    font-family:inherit;
    border-radius:4px;
    cursor:pointer;
    transition:0.2s;
}

.mode-btn.active {
    background:#00eaff;
    color:#00111f;
    font-weight:bold;
    box-shadow:0 0 10px #00eaff;
}

.recover-box input[type="text"],
.recover-box input[type="email"] {
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-bottom:15px;
    background:#000814;
    border:1px solid #00eaff55;
    color:#c8f7ff;
    border-radius:4px;
    font-size:15px;
    font-family:inherit;
}

.recover-box input:focus {
    outline:none;
    border-color:#00eaff;
    box-shadow:0 0 10px #00eaff55;
}

.recover-box button.submit-btn {
    width:100%;
    padding:12px;
    background:#00eaff;
    color:#00111f;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    font-family:inherit;
    transition:0.2s;
}

.recover-box button.submit-btn:hover {
    background:#5ef2ff;
    box-shadow:0 0 12px #00eaff;
}

.back-link {
    display:block;
    margin-top:20px;
    color:#00eaff;
    font-size:13px;
    text-decoration:none;
}
.back-link:hover { text-decoration:underline; }
</style>

<link rel="preload" as="script" href="https://cdn.iubenda.com/cs/iubenda_cs.js"/>
<link rel="preload" as="script" href="https://cdn.iubenda.com/cs/tcf/stub-v2.js"/>
<script src="https://cdn.iubenda.com/cs/tcf/stub-v2.js"></script>
<script>
(_iub=self._iub||[]).csConfiguration={
	cookiePolicyId: 12413505,
	siteId: 4661380,
	localConsentDomain: 'anonlab.it',
	timeoutLoadConfiguration: 30000,
	lang: 'it',
	enableTcf: true
};
</script>
<script async src="https://cdn.iubenda.com/cs/iubenda_cs.js"></script>
<script src="/js/main.js"></script>
</head>

<body>

<div class="recover-box">
  <h1 id="titolo-recupero">Recupero Password</h1>

  <!-- SELETTORE OPZIONI -->
  <div class="mode-selector">
    <button type="button" class="mode-btn" onclick="selezionaModo('username')">Username</button>
    <button type="button" class="mode-btn active" onclick="selezionaModo('password')">Password</button>
    <button type="button" class="mode-btn" onclick="selezionaModo('entrambi')">Entrambi</button>
  </div>

  <p id="descrizione-recupero">
    Inserisci il tuo <strong>username o la tua email</strong> per ricevere il link di ripristino password.
  </p>

  <form action="https://angelonline.altervista.org/backend/recover.php" method="POST">
      <!-- Campo nascosto che dice al backend cosa inviare -->
      <input type="hidden" name="tipo" id="input-tipo" value="password">

      <input type="text"
             name="input"
             id="campo-input"
             placeholder="Username o Email"
             required
             autocomplete="username">

      <button type="submit" class="submit-btn" id="btn-invia">Invia Link di Reset</button>
  </form>

  <a href="/login.html" class="back-link">⬅ Torna al Login</a>
</div>

<script>
function selezionaModo(modo) {
  const titolo = document.getElementById("titolo-recupero");
  const desc = document.getElementById("descrizione-recupero");
  const inputTipo = document.getElementById("input-tipo");
  const campoInput = document.getElementById("campo-input");
  const btn = document.getElementById("btn-invia");
  const buttons = document.querySelectorAll(".mode-btn");

  buttons.forEach(b => b.classList.remove("active"));

  if (modo === "username") {
    buttons[0].classList.add("active");
    titolo.textContent = "Recupero Username";
    desc.innerHTML = "Hai scordato il tuo username? Inserisci la <strong>tua email</strong> con cui ti sei registrato:";
    inputTipo.value = "username";
    campoInput.placeholder = "Inserisci la tua Email";
    campoInput.type = "email";
    btn.textContent = "Recupera Username";
  } else if (modo === "entrambi") {
    buttons[2].classList.add("active");
    titolo.textContent = "Recupero Credenziali";
    desc.innerHTML = "Inserisci la <strong>tua email</strong>: ti invieremo il tuo username e il link per impostare una nuova password.";
    inputTipo.value = "entrambi";
    campoInput.placeholder = "Inserisci la tua Email";
    campoInput.type = "email";
    btn.textContent = "Recupera Tutto";
  } else {
    buttons[1].classList.add("active");
    titolo.textContent = "Recupero Password";
    desc.innerHTML = "Inserisci il tuo <strong>username o la tua email</strong> per ricevere il link di ripristino password.";
    inputTipo.value = "password";
    campoInput.placeholder = "Username o Email";
    campoInput.type = "text";
    btn.textContent = "Invia Link di Reset";
  }
}

// All'apertura della pagina, legge il parametro ?mode= dall'URL
const urlParams = new URLSearchParams(window.location.search);
const modoRichiesto = urlParams.get("mode");
if (modoRichiesto === "username" || modoRichiesto === "entrambi") {
  selezionaModo(modoRichiesto);
} else {
  selezionaModo("password");
}
</script>

</body>
</html>
