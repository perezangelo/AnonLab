<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Recupero Credenziali — AnonLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/css/style.css">

<style>
  body {
    background:#050510;
    color:#0f0;
    font-family:Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
  }

  .recover-box {
    text-align:center;
    padding:40px;
    border:1px solid #0f0;
    background:#0a0a20;
    box-shadow:0 0 18px #0f0;
    max-width:420px;
    border-radius:10px;
  }

  .recover-box h2 {
    margin-bottom:15px;
    color:#0f0;
    text-shadow:0 0 12px #0f0;
  }

  .recover-box p {
    color:#8f8;
    font-size:15px;
    margin-bottom:20px;
  }

  .recover-box input {
    width:90%;
    padding:12px;
    margin-bottom:15px;
    background:#02020a;
    border:1px solid #0f0;
    color:#0f0;
    border-radius:4px;
    font-size:15px;
  }

  .recover-box button {
    padding:12px 28px;
    background:#0f0;
    color:#000;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
  }

  .recover-box button:hover {
    background:#8f8;
  }

  #msg {
    display:none;
    margin-top:20px;
    color:#0f0;
    font-size:14px;
  }
</style>

<!-- IUBENDA COOKIE SOLUTION -->
<script type="text/javascript" src="https://embeds.iubenda.com/widgets/bb10e382-ea45-4e9d-802f-5257ea8d5348.js"></script>

</head>

<body>

<div class="recover-box">
  <h2>Recupero Credenziali</h2>
  <p>Inserisci <b>username</b> o <b>email</b> per ricevere le tue credenziali.</p>

  <form action="https://angelonline.altervista.org/backend/recover.php"
        method="POST"
        onsubmit="mostraMessaggio()">

      <input type="text"
             name="input"
             placeholder="Username o Email"
             required
             autocomplete="username"
             inputmode="text"
             aria-label="Inserisci username o email">

      <button type="submit">Recupera</button>
  </form>

  <p id="msg">Operazione completata. Verrai reindirizzato alla home...</p>
</div>

<script>
function mostraMessaggio() {
  document.getElementById("msg").style.display = "block";
  setTimeout(() => {
    window.location.href = "/";
  }, 3000);
}
</script>

</body>
</html>
