<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Registrazione - AnonLab</title>

<style>
body {
  background:#050510;
  color:#0ff;
  font-family:Consolas, monospace;
  padding:20px;
}

.box {
  max-width:420px;
  margin:60px auto;
  padding:30px;
  border:1px solid #0ff4;
  border-radius:10px;
  background:#0a0a20;
  box-shadow:0 0 18px #0ff3;
}

.box h2 {
  text-align:center;
  color:#0ff;
  text-shadow:0 0 12px #0ff;
  margin-bottom:10px;
}

.box p {
  text-align:center;
  color:#7dfcff;
  margin-bottom:15px;
}

input {
  width:100%;
  padding:12px;
  margin:10px 0;
  background:#02020a;
  border:1px solid #0ff4;
  color:#0ff;
  border-radius:4px;
  font-size:15px;
}

button {
  width:100%;
  padding:12px;
  background:#0ff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-weight:bold;
  color:#000;
  font-size:15px;
  margin-top:10px;
}

button:hover {
  opacity:0.85;
}

#userCheck, #emailCheck {
  font-size:12px;
  color:#f55;
  display:none;
  margin-top:-5px;
}
</style>

<!-- IUBENDA COOKIE SOLUTION -->
<script type="text/javascript" src="https://embeds.iubenda.com/widgets/bb10e382-ea45-4e9d-802f-5257ea8d5348.js"></script>

  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y46cg93s3m");
</script>              

</head>
<body>

<div class="box">
  <h2>Registrazione</h2>
  <p>Riceverai una password temporanea via email.</p>

  <form action="https://angelonline.altervista.org/backend/register.php" method="POST">

      <input type="text"
             name="username"
             placeholder="Username"
             required
             autocomplete="username"
             inputmode="text"
             aria-label="Inserisci il tuo username">

      <p id="userCheck"></p>

      <input type="email"
             name="email"
             placeholder="Email"
             required
             autocomplete="email"
             inputmode="email"
             aria-label="Inserisci la tua email">

      <p id="emailCheck"></p>

      <button type="submit">Registrati</button>
  </form>
</div>

<div id="confirmBox" style="
    display:none;
    margin-top:15px;
    padding:15px;
    border:1px solid #0ff4;
    background:#0a0a20;
    color:#0ff;
    border-radius:6px;
    box-shadow:0 0 12px #0ff6;
    text-align:center;
    font-size:14px;
">
    Registrazione completata! Controlla la tua email per la password temporanea.
</div>

<script>
const userField = document.querySelector("input[name='username']");
const emailField = document.querySelector("input[name='email']");
const userCheck = document.getElementById("userCheck");
const emailCheck = document.getElementById("emailCheck");

userField.addEventListener("input", () => {
    fetch("https://angelonline.altervista.org/backend/check_user.php?username=" + userField.value)
    .then(r => r.text())
    .then(res => {
        if (res === "exists") {
            userCheck.style.display = "block";
            userCheck.innerHTML = "⚠️ Username già in uso";
        } else {
            userCheck.style.display = "none";
        }
    });
});

emailField.addEventListener("input", () => {
    fetch("https://angelonline.altervista.org/backend/check_user.php?email=" + emailField.value)
    .then(r => r.text())
    .then(res => {
        if (res === "exists") {
            emailCheck.style.display = "block";
            emailCheck.innerHTML = "⚠️ Email già registrata";
        } else {
            emailCheck.style.display = "none";
        }
    });
});

document.querySelector("form").addEventListener("submit", function(e) {
    e.preventDefault();

    const form = this;
    const box = document.getElementById("confirmBox");

    fetch(form.action, {
        method: "POST",
        body: new FormData(form)
    })
    .then(r => r.text())
    .then(res => {
        box.style.display = "block";
        box.innerHTML = res.includes("Registrazione completata")
            ? "Registrazione completata! Controlla la tua email."
            : res;
    });
});
</script>

</body>
</html>
