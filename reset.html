<style>
body {
  background:#050510;
  color:#0ff;
  font-family:Consolas, monospace;
  padding:20px;
}

.sidebar-box {
  max-width:420px;
  margin:60px auto;
  padding:30px;
  border:1px solid #0ff4;
  border-radius:10px;
  background:#0a0a20;
  box-shadow:0 0 18px #0ff3;
  text-align:center;
}

.sidebar-box h3 {
  color:#0ff;
  text-shadow:0 0 12px #0ff;
  margin-bottom:15px;
}

.sidebar-icon {
  width:64px;
  margin-bottom:15px;
}

input {
  width:100%;
  padding:12px;
  margin:10px 0;
  background:#02020a;
  border:1px solid #0ff4;
  color:#0ff;
  border-radius:4px;
  font-size:15px;
}

button {
  width:100%;
  padding:12px;
  background:#0ff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-weight:bold;
  color:#000;
  font-size:15px;
  margin-top:10px;
}

button:hover {
  opacity:0.85;
}

#reset-status {
  margin-top:15px;
  font-size:14px;
  color:#7dfcff;
}
</style>

</head>
<body>

<div class="sidebar-box" aria-label="Reset password">
  <img src="/img/support.png" class="sidebar-icon" alt="Icona reset password">
  <h3>Reimposta Password</h3>

  <form id="reset-password-form">

    <input type="password"
           id="new-password"
           placeholder="Nuova password"
           required
           autocomplete="new-password"
           inputmode="text"
           aria-label="Inserisci la nuova password">

    <input type="password"
           id="confirm-password"
           placeholder="Conferma password"
           required
           autocomplete="new-password"
           inputmode="text"
           aria-label="Conferma la nuova password">

    <button type="submit">Aggiorna Password</button>
  </form>

  <p id="reset-status"></p>
</div>

<script src="/js/reset.js"></script>

</body>
</html>
