<section class="widget-large">
  <div class="box-title-row">
    <img src="/img/threat-1.png" class="box-title-icon" alt="Radar Cyber">
    <h2>Cyber Threat Monitor</h2>
  </div>

  <div id="threat-last-update" class="threat-update">Last Update: --:--:--</div>

  <div class="threat-bars">

      <div class="threat-row">
          <span id="label-global" data-title="Global Threat Level" class="threat-label">Global Threat Level</span>
          <div class="bar-container">
              <div id="bar-global" class="bar-fill"><span class="bar-value">0%</span></div>
          </div>
      </div>

      <div class="threat-row">
          <span id="label-baseScoreAvg" data-title="Average CVSS Score" class="threat-label">Average CVSS Score</span>
          <div class="bar-container">
              <div id="bar-baseScoreAvg" class="bar-fill"><span class="bar-value">0%</span></div>
          </div>
      </div>

      <div class="threat-row">
          <span id="label-highCount" data-title="High Severity CVE" class="threat-label">High Severity CVE</span>
          <div class="bar-container">
              <div id="bar-highCount" class="bar-fill"><span class="bar-value">0%</span></div>
          </div>
      </div>

      <div class="threat-row">
          <span id="label-networkCount" data-title="Network Exposure (AV:N)" class="threat-label">Network Exposure</span>
          <div class="bar-container">
              <div id="bar-networkCount" class="bar-fill"><span class="bar-value">0%</span></div>
          </div>
      </div>

      <div class="threat-row">
          <span id="label-confImpact" data-title="Confidentiality Impact" class="threat-label">Confidentiality Impact</span>
          <div class="bar-container">
              <div id="bar-confImpact" class="bar-fill"><span class="bar-value">0%</span></div>
          </div>
      </div>

      <div class="threat-row">
          <span id="label-availImpact" data-title="Availability Impact" class="threat-label">Availability Impact</span>
          <div class="bar-container">
              <div id="bar-availImpact" class="bar-fill"><span class="bar-value">0%</span></div>
          </div>
      </div>

  </div>
</section>
