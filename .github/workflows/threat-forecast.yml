name: Update Threat Forecast

on:
  schedule:
    # Esegue ogni lunedì alle 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permette anche di avviarlo a mano da GitHub

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: 20

      - name: Generate Forecast & Push to Altervista
        env:
          FORECAST_TOKEN: ${{ secrets.FORECAST_SECRET_TOKEN }}
        run: |
          node -e '
          const https = require("https");

          // Recupera gli ultimi alert da CISA KEV per costruire previsioni contestualizzate
          const cisaUrl = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json";

          https.get(cisaUrl, (res) => {
            let body = "";
            res.on("data", chunk => body += chunk);
            res.on("end", () => {
              try {
                const data = JSON.parse(body);
                const recentVulns = (data.vulnerabilities || []).slice(-5);
                const vendors = [...new Set(recentVulns.map(v => v.vendorProject))].join(", ");

                const today = new Date();
                const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
                const period = `${today.getDate()}/${today.getMonth() + 1} - ${nextWeek.getDate()}/${nextWeek.getMonth() + 1}`;

                const payload = {
                  period: `Finestra 7gg (${period})`,
                  items: [
                    `Rischio elevato di exploit mirati su perimetri di rete (${vendors || "Edge appliances & VPN"}).`,
                    "Campagne di spear-phishing avanzate con esche a tema fatturazione e credenziali cloud.",
                    "Attività persistente di ricognizione botnet verso porte esposte non standard.",
                    "Incremento tentativi di evasione EDR tramite Living-off-the-Land (LotL) binari legittimi."
                  ]
                };

                const postData = JSON.stringify(payload);
                const options = {
                  hostname: "angelonline.altervista.org",
                  path: "/soc/threat-forecast.php",
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + process.env.FORECAST_TOKEN,
                    "Content-Length": Buffer.byteLength(postData)
                  }
                };

                const req = https.request(options, (resp) => {
                  let respBody = "";
                  resp.on("data", c => respBody += c);
                  resp.on("end", () => {
                    console.log("Risposta Altervista:", respBody);
                    if (resp.statusCode !== 200) process.exit(1);
                  });
                });

                req.on("error", (e) => {
                  console.error("Errore HTTP:", e);
                  process.exit(1);
                });

                req.write(postData);
                req.end();

              } catch(e) {
                console.error("Errore parsing:", e);
                process.exit(1);
              }
            });
          }).on("error", (err) => {
            console.error("Errore fetch CISA:", err);
            process.exit(1);
          });
          '
