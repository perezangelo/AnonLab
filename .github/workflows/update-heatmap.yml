name: Update Heatmap Data

on:
  schedule:
    - cron: "0 */12 * * *"   # ogni 12 ore
  workflow_dispatch:         # avvio manuale

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Generate real heatmap data
        run: |
          python3 scripts/generate_heatmap.py

      - name: Commit updated heatmap.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/heatmap.json
          git commit -m "Update heatmap data"
          git push
