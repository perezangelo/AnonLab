name: Update Heatmap Data

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    # Permette al workflow di scrivere e pushare le modifiche nel repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate real heatmap data
        run: python3 scripts/generate_heatmap.py

      - name: Commit updated heatmap.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heatmap.json
          git commit -m "Update heatmap data" || echo "No changes to commit"
          git push
