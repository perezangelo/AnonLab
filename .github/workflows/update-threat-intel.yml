name: Update Threat Intelligence Data

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate real TI data
        run: |
          python3 scripts/generate_threat_intel.py

      - name: Commit updated TI JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/threat-intel.json
          git commit -m "Update threat intel data" || echo "No changes to commit"
          git push
