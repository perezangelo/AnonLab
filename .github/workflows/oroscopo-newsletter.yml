name: Newsletter Oroscopo

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-and-send:
    runs-on: ubuntu-latest

    steps:

      - name: Aggiorna oroscopi
        run: |
          curl -L "https://angelonline.altervista.org/backend/update-oroscopi.php"

      - name: Attendi aggiornamento
        run: sleep 10

      - name: Invia newsletter
        run: |
          curl -L "https://angelonline.altervista.org/backend/cron-newsletter-oroscopo.php?token=ANONLAB2026"

