name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ftp.angelonline.altervista.org }}
          username: ${{ secrets.angelonline }}
          password: ${{ secrets.angelo71 }}

          exclude: |
            **/.git*
            **/.github/**
            **/backend/**
            **/counter/**
            **/data/**
            **/*.php
