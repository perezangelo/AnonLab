name: Deploy Frontend to Altervista

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets. ftp.angelonline.altervista.org }}
          username: ${{ secrets.angelonline }}
          password: ${{ secrets.angelo71 }}

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**

            **/*.php
            **/*.sql
            **/*.log

            backend/**
            counter/**
            data/**
            newsletter/**
            api/**
            logs/**
            tmp/**
