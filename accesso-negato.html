<!DOCTYPE html>

<head>

<title>Accesso Negato — AnonLab</title>

<!-- SEO -->
<meta name="robots" content="noindex, follow">

<link rel="stylesheet" href="/css/main.css">

<style>
body {
    background:#000814;
    color:#00eaff;
    font-family:"Courier New", monospace;
    margin:0;
    padding:0;
}

.error-container {
    max-width:480px;
    margin:120px auto;
    background:#00111f;
    border:1px solid #00eaff55;
    border-radius:10px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 22px #00eaff55;
}

.error-container h1 {
    color:#00eaff;
    font-size:2rem;
    text-shadow:0 0 12px #00eaff;
    margin-bottom:20px;
}

.error-container p {
    color:#c8f7ff;
    font-size:1.1rem;
    line-height:1.6;
}

.error-links {
    margin-top:30px;
}

.error-links a {
    display:block;
    margin:10px 0;
    padding:12px;
    border:1px solid #00eaff55;
    border-radius:8px;
    color:#00eaff;
    text-decoration:none;
    font-weight:bold;
    transition:0.2s;
}

.error-links a:hover {
    background:#00eaff22;
    box-shadow:0 0 12px #00eaff;
}
</style>

               Se pensi che si tratti di un errore, prova ad effettuare nuovamente il login.</p>

            <div class="error-links">
                <a href="/login.html">Effettua il Login</a>

            </div>
        </div>
