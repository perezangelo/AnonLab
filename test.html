<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnonLab — Test Lab</title>

<!-- Stili isolati (non interferiscono con il sito) -->
<style>
    body {
        background:#0a0a0a;
        color:#e0e0e0;
        font-family:Arial, sans-serif;
        padding:20px;
    }

    h1 {
        text-align:center;
        color:#00eaff;
        margin-bottom:30px;
        text-shadow:0 0 10px #00eaff;
    }

    .test-box {
        background:#111;
        border:1px solid #00eaff;
        border-radius:12px;
        padding:20px;
        margin-bottom:40px;
        box-shadow:0 0 20px #00eaff33;
    }

    /* Slider 3D */
    .slider-3d-container {
        perspective:1000px;
        width:100%;
        max-width:420px;
        margin:0 auto;
    }

    .slider-3d {
        width:100%;
        height:240px;
        border-radius:12px;
        overflow:hidden;
        transform-style:preserve-3d;
        animation:spin3d 12s infinite linear;
        position:relative;
    }

    .slider-3d img {
        width:100%;
        height:100%;
        object-fit:cover;
        position:absolute;
        top:0;
        left:0;
    }

    @keyframes spin3d {
        0%   { transform:rotateY(0deg); }
        33%  { transform:rotateY(120deg); }
        66%  { transform:rotateY(240deg); }
        100% { transform:rotateY(360deg); }
    }

    /* Slider Fade */
    .slider-fade {
        width:100%;
        max-width:420px;
        height:240px;
        margin:0 auto;
        border-radius:12px;
        overflow:hidden;
        position:relative;
    }

    .slider-fade img {
        width:100%;
        height:100%;
        object-fit:cover;
        position:absolute;
        animation:fadeHero 12s infinite;
    }

    .slider-fade img:nth-child(2) { animation-delay:4s; }
    .slider-fade img:nth-child(3) { animation-delay:8s; }

    @keyframes fadeHero {
        0% { opacity:1; }
        25% { opacity:1; }
        33% { opacity:0; }
        90% { opacity:0; }
        100% { opacity:1; }
    }

    /* Pulsanti neon */
    .neon-btn {
        display:inline-block;
        padding:12px 20px;
        background:#00eaff;
        color:#000;
        font-weight:bold;
        border-radius:6px;
        text-decoration:none;
        box-shadow:0 0 10px #00eaffaa;
        transition:0.2s;
        margin-top:20px;
    }

    .neon-btn:hover {
        background:#ff7b00;
        box-shadow:0 0 14px #ff7b00aa;
        transform:translateY(-2px);
    }
</style>
</head>

<body>

<h1>AnonLab — Test Lab</h1>

    <div class="test-box">
    <h2 style="color:#00eaff;">🎥 Ken Burns Effect — Versione Premium</h2>
    <p>Effetto cinematografico con zoom + pan.</p>

    <div style="
        width:100%;
        max-width:420px;
        height:240px;
        margin:0 auto;
        border-radius:12px;
        overflow:hidden;
        position:relative;
    ">
        <div style="
            width:100%;
            height:100%;
            background:url('/img/hero-bg.png') center/cover no-repeat;
            animation:kenburnsPremium 14s ease-in-out infinite;
        "></div>
    </div>

    <style>
    @keyframes kenburnsPremium {
        0% {
            background-size:110%;
            background-position:center;
        }
        25% {
            background-size:120%;
            background-position:top right;
        }
        50% {
            background-size:130%;
            background-position:center left;
        }
        75% {
            background-size:140%;
            background-position:bottom center;
        }
        100% {
            background-size:110%;
            background-position:center;
        }
    }
    </style>
</div>

    
<body class="dark-mode">
<!-- ⭐ BLOCCO EYES FIXED — VERSIONE CORRETTA -->
<div style="
    position:relative;
    width:260px;
    margin:20px auto 10px auto;
    display:block;
">

    <!-- CAPPUCCIO -->
    <img 
        src="/img/eyes.png"
        alt="AnonLab Eyes"
        style="
            width:260px;
            height:auto;
            display:block;
            border-radius:10px;
            filter:brightness(1.15);
        "
    >

    <!-- OCCHI FISSI -->
    <div style="
        position:absolute;
        top:46%;
        left:50%;
        width:70px;
        height:28px;
        background:#00eaff;
        border-radius:50%;
        filter:blur(6px);
        transform:translate(-50%, -50%);
        opacity:0.9;
        pointer-events:none;
    "></div>

</div>

</body>
</html>
