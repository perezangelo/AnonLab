<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HERO — AnonLab</title>

    <style>
        body {
            background: #05080c;
            font-family: Arial, sans-serif;
            padding: 40px;
            color: #fff;
        }

        /* HERO — STRUTTURA CORRETTA */
        .tools-hero {
            max-width: 540px;
            margin: 0 auto 40px auto;
        }

        /* RIGA 1: IMMAGINE + TITOLO */
        .tools-hero-top {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        /* IMMAGINE GRANDE */
        .tools-hero-img {
            width: 140px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 6px #00eaff);
        }

        /* TITOLO */
        .tools-hero-title {
            flex: 1;
        }

        .tools-hero-title h1 {
            margin: 0;
            color: #00eaff;
            font-size: 2rem;
            text-shadow: 0 0 5px #00eaff;
        }

        /* RIGA 2: TESTO A LARGHEZZA PIENA */
        .tools-hero-desc {
            margin-top: 12px;
            color: #b8dfff;
            font-size: 1.2rem;
            line-height: 1.7;
            width: 100%;
        }

        /* BOX TOOLS NEON CYBER (se vuoi testare anche un box) */
        .tools-box {
            max-width: 540px;
            margin: 0 auto 40px auto;
            background: #0a0f14;
            border: 1px solid #00eaff55;
            box-shadow: 0 0 12px #00eaff55, 0 0 24px #00eaff33 inset;
            border-radius: 10px;
            padding: 20px;
        }

        .box-title-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .box-title-icon {
            width: 48px;
            height: 48px;
            margin-right: 12px;
        }
    </style>
</head>

<body>

    <!-- HERO COMPLETA -->
    <section class="tools-hero">

        <!-- RIGA 1: IMMAGINE + TITOLO -->
        <div class="tools-hero-top">
            <img src="/img/tools-hero.png" alt="Cyber Tools" class="tools-hero-img">

            <div class="tools-hero-title">
                <h1>Cyber Tools Center</h1>
            </div>
        </div>

        <!-- RIGA 2: TESTO A LARGHEZZA PIENA -->
        <p class="tools-hero-desc">
            Strumenti avanzati per analisi, diagnostica, sicurezza e OSINT.
            Questa sezione è il punto di partenza per operazioni tecniche,
            verifiche di rete, analisi di domini, IP, protocolli e molto altro.
        </p>

    </section>

</body>
</html>
