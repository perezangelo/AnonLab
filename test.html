<style>
  /* Stili generali del Widget Sidebar */
  .sidebar-box {
    background: #1e1e24; /* Sfondo scuro per far risaltare il contrasto */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 25px;
    box-shadow: inset 1px 1px 2px rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.2);
    max-width: 320px;
  }

  .sidebar-box h3 {
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-left: 3px solid #1877F2; /* Accento colorato iniziale */
    padding-left: 10px;
  }

  /* Contenitore delle icone */
  .social-icons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    padding: 5px 0;
  }

  /* Il Bottone in Rilievo (Stile Neumorfico) */
  .social-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #2a2a32;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    
    /* Ombre incrociate per creare l'effetto 3D sbalzato in rilievo */
    box-shadow: 
      -3px -3px 7px rgba(255, 255, 255, 0.05),
      3px 3px 7px rgba(0, 0, 0, 0.3),
      inset 1px 1px 0px rgba(255, 255, 255, 0.1);
  }

  /* Gestione transizione fluida delle icone SVG interne */
  .social-btn svg {
    transition: transform 0.3s ease, fill 0.3s ease;
  }

  /* Effetto sollevamento al passaggio del mouse (Hover) */
  .social-btn:hover {
    transform: translateY(-2px);
    box-shadow: 
      -1px -1px 3px rgba(255, 255, 255, 0.05),
      2px 4px 10px rgba(0, 0, 0, 0.4);
  }
  
  /* Effetto pressione realistica al click (Active) */
  .social-btn:active {
    transform: translateY(1px);
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05);
  }

  /* Personalizzazione colori e bagliori Neon per ogni Brand all'Hover */
  
  /* Facebook */
  .social-btn.fb svg { fill: #a6c9ff; } /* Colore soft di base per contrasto */
  .social-btn.fb:hover { background: #1877F2; box-shadow: 0 0 15px rgba(24, 119, 242, 0.6); }
  .social-btn.fb:hover svg { fill: #ffffff; transform: scale(1.1); }

  /* Instagram */
  .social-btn.ig svg { fill: #ffb3c1; }
  .social-btn.ig:hover { background: #E4405F; box-shadow: 0 0 15px rgba(228, 64, 95, 0.6); }
  .social-btn.ig:hover svg { fill: #ffffff; transform: scale(1.1); }

  /* X / Twitter */
  .social-btn.x-tw svg { fill: #e1e1e1; }
  .social-btn.x-tw:hover { background: #000000; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
  .social-btn.x-tw:hover svg { fill: #ffffff; transform: scale(1.1); }

  /* YouTube */
  .social-btn.yt svg { fill: #ffb3b3; }
  .social-btn.yt:hover { background: #FF0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
  .social-btn.yt:hover svg { fill: #ffffff; transform: scale(1.1); }

  /* Twitch */
  .social-btn.tw svg { fill: #d7bfff; }
  .social-btn.tw:hover { background: #9146FF; box-shadow: 0 0 15px rgba(145, 70, 255, 0.6); }
  .social-btn.tw:hover svg { fill: #ffffff; transform: scale(1.1); }
</style>
