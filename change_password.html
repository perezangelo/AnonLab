      <input type="password"

      <!-- NUOVA PASSWORD -->
      <input type="password"
             name="new_password"
             placeholder="Nuova password"
             autocomplete="new-password"
             inputmode="text"
             aria-label="Inserisci la nuova password">

      <!-- CONFERMA -->
      <input type="password"
             name="confirm_password"
             placeholder="Conferma nuova password"
             autocomplete="new-password"
             inputmode="text"
             aria-label="Conferma la nuova password">

      <!-- CAMBIA PASSWORD -->
      <button type="submit" name="change_password">Aggiorna Password</button>
